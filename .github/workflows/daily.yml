# Daily digest. The file lives on the default branch (dev) because GitHub only
# schedules workflows from there, but the job runs the released code on main
# and commits the digest and the state back to main (see Docs/scheduling.md).
name: Daily digest
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate today's digest (--force)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    # A normal run takes a few minutes; this caps a degraded API at one hour.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --no-dev
      - name: Run the pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            uv run auto-rss-sorting --force
          else
            uv run auto-rss-sorting
          fi
      - name: Commit the digest and the state
        run: |
          git add digests state
          if git diff --cached --quiet; then
            echo "Nothing to commit: today's digest already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m ":newspaper: Digest $(date -u +%F)"
          git push origin main
